[package]
name = "codex-daily-report"
version = "0.5.0"
edition = "2021"

[lib]
name = "daily_report"
crate-type = ["rlib"]

[[bin]]
name = "codex-daily-report"
path = "src/main.rs"

[features]
default = []
leader = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tower", "dep:flate2", "dep:aes-gcm", "dep:pulldown-cmark", "dep:zip", "dep:webview2-com", "dep:rcgen", "dep:p12", "windows/Win32_NetworkManagement_IpHelper", "windows/Win32_NetworkManagement_Ndis", "windows/Win32_Networking_WinSock"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
aes-gcm = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
regex = "1"
walkdir = "2"
url = "2"
tokio = { version = "1", features = ["full"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
axum = { version = "0.8", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service", "http1", "http2"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
flate2 = { version = "1", optional = true }
aes-gcm = { version = "0.10", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }
zip = { version = "4.6", default-features = false, features = ["deflate"], optional = true }
rcgen = { version = "0.13", optional = true }
zstd = "0.14"

# The Windows member and both Leader ends keep using Win32/WebView2. The Linux
# member end replaces them with the platform implementations below.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security", "Win32_System_Com"] }
webview2-com = { version = "0.39", optional = true }
p12 = { version = "0.6", optional = true }

# Linux member: secrets are encrypted with a machine-bound key and one running
# instance at a time; the second launch restores the hidden window instead of the
# Windows-style message box.
[target.'cfg(not(windows))'.dependencies]
aes-gcm = "0.10"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
